<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <title>لوحة التحكم</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #161922;
      --line: #282c39;
      --field: #0d0f14;
      --field-line: #333846;
      --text: #e8eaed;
      --gold: #e0a96d;
      --gold-hover: #c69259;
      --ok: #4caf50;
      --err: #f44336;
      --warn: orange;
    }
    * { box-sizing: border-box; }
    html, body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      width: 100%;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }
    .wrap {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px 16px 80px 16px;
    }
    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--line);
    }
    .card.accent { border-color: var(--gold); }
    h2 { color: var(--gold); margin-top: 0; margin-bottom: 16px; font-size: 22px; }
    h3 { margin-top: 0; color: var(--gold); font-size: 17px; margin-bottom: 12px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #b8bcc6; }
    input, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid var(--field-line);
      background: var(--field);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      display: block;
    }
    input:focus { outline: 2px solid var(--gold); }
    button {
      background: var(--gold);
      color: #111;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 4px;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg { font-size: 13px; margin-top: 6px; line-height: 1.5; word-break: break-word; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>لوحة التحكم</h2>

    <!-- صندوق تسجيل الدخول -->
    <div class="card" id="authBox">
      <h3>🔐 تسجيل دخول الإدارة</h3>
      <label>اسم المستخدم أو البريد</label>
      <input type="text" id="adminUser" placeholder="أدخل البريد أو المستخدم">
      <label>كلمة المرور</label>
      <input type="password" id="adminPass" placeholder="أدخل كلمة المرور">
      <button type="button" id="loginBtn">تسجيل الدخول</button>
      <div id="loginMsg" class="msg"></div>
    </div>

    <!-- سحب مانجا كاملة -->
    <div class="card accent">
      <h3>🚀 سحب مانجا كاملة (MangaDex)</h3>
      <label>رابط المانجا أو المعرف</label>
      <input type="text" id="fullMangaUrl" placeholder="الصق الرابط هنا" dir="ltr">
      <button type="button" id="importBtn">جلب البيانات والغلاف تلقائياً</button>
      <div id="importMsg" class="msg"></div>
    </div>

    <!-- إضافة عمل يدوياً -->
    <div class="card">
      <h3>إضافة عمل يدوياً</h3>
      <label>عنوان العمل (عربي) *</label>
      <input type="text" id="mTitleAr">
      <label>العنوان (إنجليزي)</label>
      <input type="text" id="mTitleEn" dir="ltr">
      <label>رابط الغلاف (https)</label>
      <input type="url" id="mCover" dir="ltr">
      <label>التقييم</label>
      <input type="number" id="mRating" min="0" max="10" step="0.1" placeholder="9.5">
      <button type="button" id="saveBtn">حفظ العمل</button>
      <div id="manualMsg" class="msg"></div>
    </div>
  </div>

  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);

    function show(el, color, text) {
      el.style.color = color;
      el.textContent = text;
    }

    async function postJson(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      return { res, data };
    }

    // تسجيل الدخول الصحيح عبر السيرفر
    $('loginBtn').addEventListener('click', async () => {
      const btn = $('loginBtn');
      const msg = $('loginMsg');
      show(msg, '#e0a96d', 'جاري التحقق...');
      btn.disabled = true;

      try {
        const { res, data } = await postJson('/api/auth/login', {
          username: $('adminUser').value.trim(),
          password: $('adminPass').value
        });
        if (res.ok) {
          show(msg, '#4caf50', '✅ تم تسجيل الدخول بنجاح! يمكنك السحب الآن.');
          $('authBox').style.borderColor = '#4caf50';
        } else {
          show(msg, '#f44336', '❌ خطأ: ' + (data.error || 'بيانات الدخول غير صحيحة'));
        }
      } catch (err) {
        show(msg, '#f44336', '❌ تعذر الاتصال بالسيرفر');
      } finally {
        btn.disabled = false;
      }
    });

    // سحب مانجا كاملة
    $('importBtn').addEventListener('click', async () => {
      const btn = $('importBtn');
      const urlInput = $('fullMangaUrl');
      const msg = $('importMsg');
      const raw = urlInput.value.trim();

      const match = raw.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
      if (!match) {
        show(msg, 'orange', '⚠️ يرجى وضع رابط MangaDex صالح!');
        return;
      }

      show(msg, '#e0a96d', '⏳ جاري الاتصال وسحب البيانات والغلاف من MangaDex...');
      btn.disabled = true;

      try {
        const { res, data } = await postJson('/api/admin/auto-import-manga', { mangaUrl: match[0] });

        if (res.status === 401 || res.status === 403) {
          show(msg, '#f44336', '❌ يرجى تسجيل الدخول أولاً من الصندوق في الأعلى!');
          return;
        }

        if (res.ok && data.ok) {
          const d = data.data || {};
          show(msg, '#4caf50', `✅ تم سحب العمل بنجاح! الاسم: [${d.title}] (المعرف: ${d.mangaId})`);
          urlInput.value = '';
        } else {
          show(msg, '#f44336', '❌ خطأ: ' + (data.error || 'فشلت عملية السحب'));
        }
      } catch (err) {
        show(msg, '#f44336', '❌ تعذر الاتصال بالسيرفر');
      } finally {
        btn.disabled = false;
      }
    });

    // حفظ عمل يدوي
    $('saveBtn').addEventListener('click', async () => {
      const btn = $('saveBtn');
      const msg = $('manualMsg');
      const titleAr = $('mTitleAr').value.trim();

      if (!titleAr) {
        show(msg, 'orange', 'العنوان العربي مطلوب!');
        return;
      }

      btn.disabled = true;
      try {
        const { res, data } = await postJson('/api/admin/manga', {
          title_ar: titleAr,
          title_en: $('mTitleEn').value.trim(),
          cover_url: $('mCover').value.trim(),
          rating: Number($('mRating').value.trim()) || 9
        });
        if (res.ok) {
          show(msg, '#4caf50', '✅ تم حفظ العمل بنجاح!');
          ['mTitleAr', 'mTitleEn', 'mCover', 'mRating'].forEach(id => $(id).value = '');
        } else {
          show(msg, '#f44336', '❌ خطأ: ' + (data.error || 'فشل الحفظ'));
        }
      } catch (e) {
        show(msg, '#f44336', '❌ تعذر الاتصال بالسيرفر');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
