<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noby Admin | لوحة التحكم</title>
  <style>
    :root { --bg: #090a0f; --card: #131620; --border: #222738; --field: #0b0d14; --text: #f0f2f5; --gold: #e5b573; --gold-hover: #cca062; --danger: #ef4444; --ok: #22c55e;}
    * { box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--text); margin: 0; padding: 0; font-family: system-ui, sans-serif; min-height: 100vh; overflow-y: auto; }
    .wrap { width: 100%; max-width: 650px; margin: 0 auto; padding: 20px 16px 80px 16px; }
    .logo-title { text-align: center; font-size: 32px; font-weight: 900; color: var(--gold); letter-spacing: 2px; margin-bottom: 24px; text-shadow: 0 0 15px rgba(229,181,115,0.3); }
    h3 { margin-top: 0; color: var(--gold); font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .card { background: var(--card); padding: 20px; border-radius: 14px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #94a3b8; font-weight: bold;}
    input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--field); color: #fff; font-size: 14px; display: block; }
    input:focus { outline: 2px solid var(--gold); border-color: transparent;}
    button { width: 100%; padding: 13px; background: var(--gold); color: #111; font-weight: bold; border-radius: 8px; border: none; font-size: 15px; cursor: pointer; margin-bottom: 10px; transition: 0.2s;}
    button:hover { background: var(--gold-hover); }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-blue:hover { background: #2563eb; }
    .btn-danger { background: var(--danger); color: white; width: auto; padding: 6px 12px; font-size: 12px; margin: 0; }
    .msg { font-size: 13px; margin-top: 10px; line-height: 1.5; text-align: center; font-weight: bold;}
    .manga-row { display: flex; justify-content: space-between; align-items: center; background: var(--field); padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); }
    .manga-info { font-size: 14px; font-weight: bold; color: #e2e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo-title">N O B Y</div>

    <div class="card" id="authBox">
      <h3>🔐 تسجيل دخول الإدارة</h3>
      <label>البريد أو اسم المستخدم</label>
      <input type="text" id="adminUser" placeholder="admin@noby.com">
      <label>كلمة المرور</label>
      <input type="password" id="adminPass" placeholder="••••••••">
      <button type="button" id="loginBtn">دخول</button>
      <button type="button" id="registerBtn" class="btn-blue">إنشاء حساب المدير</button>
      <div id="loginMsg" class="msg"></div>
    </div>

    <div class="card">
      <h3>🚀 سحب مانجا شامل من MangaDex</h3>
      <label>رابط العمل</label>
      <input type="text" id="fullMangaUrl" placeholder="https://mangadex.org/title/..." dir="ltr">
      <button type="button" id="importBtn">بدء السحب الذكي</button>
      <div id="importMsg" class="msg"></div>
    </div>

    <div class="card">
      <h3>📚 إدارة المكتبة (حذف وتعديل الأعمال)</h3>
      <div id="mangaListContainer">جاري تحميل المكتبة...</div>
    </div>
  </div>

  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    function show(el, color, text) { el.style.color = color; el.textContent = text; }

    async function postData(url, data = {}, method = 'POST') {
      const res = await fetch(url, { method, credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: method !== 'GET' ? JSON.stringify(data) : undefined });
      const json = await res.json().catch(() => ({}));
      return { res, json };
    }

    $('loginBtn').addEventListener('click', async () => {
      const msg = $('loginMsg'); show(msg, '#e5b573', 'جاري التحقق...');
      const { res, json } = await postData('/api/auth/login', { username: $('adminUser').value.trim(), password:$('adminPass').value });
      if (res.ok) { show(msg, 'var(--ok)', '✅ تم تسجيل الدخول'); loadLibrary(); } 
      else { show(msg, 'var(--danger)', '❌ ' + (json.error || 'فشل الدخول')); }
    });

    $('registerBtn').addEventListener('click', async () => {
      const msg = $('loginMsg'); show(msg, '#e5b573', 'جاري الإنشاء...');
      const { res, json } = await postData('/api/auth/register', { username: $('adminUser').value.trim(), email: $('adminUser').value.trim(), password:$('adminPass').value });
      if (res.ok) { show(msg, 'var(--ok)', '✅ تم إنشاء الحساب ودخولك بنجاح'); loadLibrary(); } 
      else { show(msg, 'var(--danger)', '❌ ' + (json.error || 'فشل')); }
    });

    // السحب الذكي مع عزل الأخطاء
    $('importBtn').addEventListener('click', async () => {
      const msg = $('importMsg'); const raw =$('fullMangaUrl').value.trim().replace(/[\[\]]/g, '');
      const match = raw.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
      if (!match) return show(msg, 'orange', '⚠️ رابط MangaDex غير صالح');
      const mangaId = match[0];

      show(msg, '#e5b573', '⏳ جاري جلب التفاصيل والغلاف والفصول...');
      const proxy = 'https://corsproxy.io/?';

      try {
        let res = await fetch(proxy + encodeURIComponent(`https://api.mangadex.org/manga/${mangaId}`));
        if (!res.ok) throw new Error('فشل الاتصال بـ MangaDex');
        let data = await res.json();
        
        const attr = data.data.attributes;
        const titleEn = attr.title.en || Object.values(attr.title)[0] || 'بدون عنوان';
        let titleAr = titleEn;
        if (attr.altTitles) {
          const arTitle = attr.altTitles.find(t => t.ar);
          if (arTitle) titleAr = arTitle.ar;
        }

        let coverUrl = '';
        const coverRel = data.data.relationships.find(r => r.type === 'cover_art');
        if (coverRel) {
          try {
            let cRes = await fetch(proxy + encodeURIComponent(`https://api.mangadex.org/cover/${coverRel.id}`));
            if (cRes.ok) {
              let cData = await cRes.json();
              coverUrl = `https://uploads.mangadex.org/covers/${mangaId}/${cData.data.attributes.fileName}`;
            }
          } catch(e){}
        }

        let chapters = [];
        try {
          let chRes = await fetch(proxy + encodeURIComponent(`https://api.mangadex.org/manga/${mangaId}/feed?limit=250&translatedLanguage[]=en&translatedLanguage[]=ar&order[chapter]=asc`));
          if (chRes.ok) {
            let chData = await chRes.json();
            for (const ch of (chData.data || [])) {
              chapters.push({ num: Number(ch.attributes.chapter) || 0, title: ch.attributes.title || `الفصل ${ch.attributes.chapter || 0}` });
            }
          }
        } catch(e){}

        const saveRes = await postData('/api/admin/save-scraped-manga', { mangaId, title_ar: titleAr, title_en: titleEn, cover_url: coverUrl, chapters });
        if (saveRes.res.ok && saveRes.json.ok) {
          show(msg, 'var(--ok)', `✅ تم سحب "${titleAr}" وحفظ (${saveRes.json.chaptersSaved}) فصل بنجاح!`);
          $('fullMangaUrl').value = '';
          loadLibrary();
        } else {
          show(msg, 'var(--danger)', '❌ فشل الحفظ في القاعدة');
        }
      } catch (e) {
        show(msg, 'var(--danger)', '❌ خطأ في السحب: ' + e.message);
      }
    });

    // جذف مانجا
    window.deleteManga = async function(id) {
      if (!confirm('هل أنت متأكد من حذف هذه المانجا وفصولها بالكامل؟')) return;
      const { res } = await postData(`/api/admin/manga/${id}`, {}, 'DELETE');
      if (res.ok) loadLibrary();
      else alert('فشل الحذف');
    }

    async function loadLibrary() {
      const container = $('mangaListContainer');
      try {
        const res = await fetch('/api/admin/manga', { credentials: 'include' });
        if (!res.ok) { container.innerHTML = '<span style="color:#94a3b8">يرجى تسجيل الدخول أولاً لعرض المكتبة</span>'; return; }
        const list = await res.json();
        if (list.length === 0) { container.innerHTML = '<span style="color:#94a3b8">لا توجد أعمال في المكتبة حالياً</span>'; return; }
        
        container.innerHTML = list.map(m => `
          <div class="manga-row">
            <div class="manga-info" title="${m.title_ar}">${m.title_ar}</div>
            <button class="btn-danger" onclick="deleteManga(${m.id})">حذف</button>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = 'خطأ في تحميل المكتبة';
      }
    }
    loadLibrary();
  </script>
</body>
</html>
