<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #161922;
      --border: #282c39;
      --field: #0d0f14;
      --text: #e8eaed;
      --gold: #e0a96d;
      --gold-hover: #c69259;
      --ok: #4caf50;
      --err: #f44336;
    }
    * { box-sizing: border-box; }
    html, body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-y: auto;
    }
    .wrap {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px 80px 16px;
    }
    h2 { color: var(--gold); margin-top: 0; font-size: 22px; }
    h3 { margin-top: 0; color: var(--gold); font-size: 16px; margin-bottom: 12px; }
    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .card.gold-border { border-color: var(--gold); }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #a0a5b5; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--field);
      color: #fff;
      font-size: 14px;
      display: block;
    }
    input:focus { outline: 2px solid var(--gold); }
    button {
      width: 100%;
      padding: 12px;
      background: var(--gold);
      color: #111;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: var(--gold-hover); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg { font-size: 13px; margin-top: 8px; line-height: 1.5; word-break: break-word; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>لوحة تحكم الموقع</h2>

    <!-- صندوق تسجيل الدخول -->
    <div class="card" id="authBox">
      <h3>🔐 تسجيل دخول الإدارة</h3>
      <label>اسم المستخدم أو البريد الإلكتروني</label>
      <input type="text" id="adminUser" placeholder="أدخل البريد أو اسم المستخدم">
      <label>كلمة المرور</label>
      <input type="password" id="adminPass" placeholder="أدخل كلمة المرور">
      <button type="button" id="loginBtn">تسجيل الدخول</button>
      <div id="loginMsg" class="msg"></div>
    </div>

    <!-- صندوق السحب الآلي -->
    <div class="card gold-border">
      <h3>🚀 سحب مانجا كاملة (MangaDex)</h3>
      <label>رابط العمل من MangaDex أو المعرف</label>
      <input type="text" id="fullMangaUrl" placeholder="الصق الرابط هنا (يقبل روابط المشاركة أيضاً)" dir="ltr">
      <button type="button" id="importBtn">جلب البيانات والغلاف تلقائياً</button>
      <div id="importMsg" class="msg"></div>
    </div>

    <!-- الإضافة اليدوية -->
    <div class="card">
      <h3>إضافة عمل يدوياً</h3>
      <label>عنوان العمل (عربي) *</label>
      <input type="text" id="mTitleAr">
      <label>العنوان (إنجليزي)</label>
      <input type="text" id="mTitleEn" dir="ltr">
      <label>رابط صورة الغلاف</label>
      <input type="url" id="mCover" dir="ltr">
      <label>التقييم</label>
      <input type="number" id="mRating" min="0" max="10" step="0.1" placeholder="9.5">
      <button type="button" id="saveBtn">حفظ العمل</button>
      <div id="manualMsg" class="msg"></div>
    </div>
  </div>

  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);

    function show(el, color, text) {
      el.style.color = color;
      el.textContent = text;
    }

    async function postData(url, data) {
      const res = await fetch(url, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json().catch(() => ({}));
      return { res, json };
    }

    // تسجيل الدخول
    $('loginBtn').addEventListener('click', async () => {
      const btn = $('loginBtn');
      const msg = $('loginMsg');
      show(msg, '#e0a96d', 'جاري التحقق...');
      btn.disabled = true;

      try {
        const { res, json } = await postData('/api/auth/login', {
          username: $('adminUser').value.trim(),
          password: $('adminPass').value
        });
        if (res.ok) {
          show(msg, '#4caf50', '✅ تم تسجيل الدخول بنجاح! يمكنك الآن سحب الأعمال.');
          $('authBox').style.borderColor = '#4caf50';
        } else {
          show(msg, '#f44336', '❌ خطأ: ' + (json.error || 'بيانات الدخول غير صحيحة'));
        }
      } catch (e) {
        show(msg, '#f44336', '❌ تعذر الاتصال بالسيرفر');
      } finally {
        btn.disabled = false;
      }
    });

    // السحب الآلي
    $('importBtn').addEventListener('click', async () => {
      const btn = $('importBtn');
      const msg = $('importMsg');
      const raw = $('fullMangaUrl').value.trim();

      const match = raw.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
      if (!match) {
        show(msg, 'orange', '⚠️ الرابط لا يحتوي على معرف مانجا صالح!');
        return;
      }

      show(msg, '#e0a96d', '⏳ جاري جلب التفاصيل والغلاف من MangaDex...');
      btn.disabled = true;

      try {
        const { res, json } = await postData('/api/admin/auto-import-manga', { mangaUrl: match[0] });

        if (res.status === 401 || res.status === 403) {
          show(msg, '#f44336', '❌ يجب تسجيل الدخول من الصندوق العلوي أولاً!');
          return;
        }

        if (res.ok && json.ok) {
          const d = json.data || {};
          show(msg, '#4caf50', `✅ تم سحب العمل بنجاح! العنوان: [${d.title}] (معرف: ${d.mangaId})`);
          $('fullMangaUrl').value = '';
        } else {
          show(msg, '#f44336', '❌ خطأ: ' + (json.error || 'فشل السحب'));
        }
      } catch (e) {
        show(msg, '#f44336', '❌ تعذر الاتصال بالسيرفر');
      } finally {
        btn.disabled = false;
      }
    });

    // الحفظ اليدوي
    $('saveBtn').addEventListener('click', async () => {
      const btn = $('saveBtn');
      const msg = $('manualMsg');
      const titleAr = $('mTitleAr').value.trim();

      if (!titleAr) {
        show(msg, 'orange', 'العنوان العربي مطلوب!');
        return;
      }

      btn.disabled = true;
      try {
        const { res, json } = await postData('/api/admin/manga', {
          title_ar: titleAr,
          title_en: $('mTitleEn').value.trim(),
          cover_url: $('mCover').value.trim(),
          rating: Number($('mRating').value.trim()) || 9
        });
        if (res.ok) {
          show(msg, '#4caf50', '✅ تم حفظ العمل بنجاح!');
          ['mTitleAr', 'mTitleEn', 'mCover', 'mRating'].forEach(id => $(id).value = '');
        } else {
          show(msg, '#f44336', '❌ خطأ: ' + (json.error || 'فشل الحفظ'));
        }
      } catch (e) {
        show(msg, '#f44336', '❌ تعذر الاتصال بالسيرفر');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
