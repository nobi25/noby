<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>لوحة التحكم</title>
  <style>
    :root{--bg:#0f1115;--card:#161922;--line:#282c39;--field:#0d0f14;--field-line:#333846;--text:#e8eaed;--gold:#e0a96d;--gold-hover:#c69259;--ok:#4caf50;--err:#f44336;--warn:orange}
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px;display:flex;justify-content:center}
    .wrap{width:100%;max-width:540px}
    .card{background:var(--card);padding:20px;border-radius:12px;margin-bottom:20px;border:1px solid var(--line)}
    .card.accent{border-color:var(--gold)}
    h2,h3{margin-top:0;color:var(--gold)}
    label{display:block;font-size:13px;margin-bottom:6px;color:#b8bcc6}
    input,button{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid var(--field-line);background:var(--field);color:#fff;font-size:14px;font-family:inherit}
    input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    button{background:var(--gold);color:#111;font-weight:bold;cursor:pointer;border:none}
    button:hover:not(:disabled){background:var(--gold-hover)}
    button:disabled{opacity:.55;cursor:not-allowed}
    .msg{font-size:13px;margin-top:6px;min-height:1.2em;line-height:1.6;word-break:break-word}
  </style>
</head>
<body>
  <div class="wrap">
    <h2>لوحة التحكم</h2>

    <div class="card" id="authBox">
      <h3>🔐 تسجيل دخول الإدارة</h3>
      <input type="text" id="adminUser" placeholder="اسم المستخدم أو البريد" autocomplete="username">
      <input type="password" id="adminPass" placeholder="كلمة المرور"
